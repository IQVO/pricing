{{- if and .Values.mcp.enabled .Values.mcp.route.enabled -}}
{{- /*
MCP exposure through the Gateway (fleet decision: the gateway route lives in the
application chart, not in warehouse-infra Terraform).

Host contract: /api/mcp/<context> -> Service <release>-mcp:8090, prefix
rewritten to /mcp (the SDK's canonical endpoint on cmd/mcp). healthz
deliberately stays off the host - it is a Kubernetes probe concern, not a
public endpoint.

NO auth plugin: endpoints are unauthenticated by fleet-wide decision (revert
2026-09-11): access control is the in-cluster boundary.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pricing.mcpFullname" . }}
  labels:
    {{- include "pricing.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  {{- with include "pricing.kongPluginNames" . }}
  annotations:
    konghq.com/plugins: {{ . | quote }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.mcp.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: {{ include "pricing.mcpFullname" . }}
          port: {{ .Values.mcp.service.port }}
{{- end }}
