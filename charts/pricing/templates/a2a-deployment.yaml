{{- if and .Values.a2a.enabled (not (include "pricing.agentsColocated" .)) }}
{{- include "pricing.requireDatabase" . -}}
{{- include "pricing.requireA2AHttpPort" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pricing.a2aFullname" . }}
  labels:
    {{- include "pricing.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  annotations:
    # agents.colocate cutover (ADR 0012): ArgoCD prunes this Deployment only after <release>-agents serves
    # (PruneLast); on the un-flip wave -1 recreates it Healthy before the wave-0 Services switch back.
    # Deployment-object annotations: syncing them rolls no pod.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "pricing.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pricing.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pricing.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "pricing.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          # Endpoint-removal drain (capacity step 3 follow-up): Kong routes to pod IPs and drops a terminating
          # pod only on its next config sync, seconds later, while cmd/a2a closes its listener at SIGTERM and an
          # idle process exits at once; without this delay Kong keeps sending to a vanished pod IP (a 502 or a
          # connect timeout through Kong on every roll). The kubelet-native sleep needs no shell (distroless).
          # terminationGracePeriodSeconds must stay above this sleep + the 10 s HTTP drain.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          # The A2A agent is READ-ONLY (ADR 0007): it needs Postgres and nothing
          # else. It does not mount the api ConfigMap and renders no
          # KAFKA_BROKERS, EVENT_PUBLISHER, consumer group or outbox variable:
          # it neither produces nor consumes, and only the api Deployment runs
          # the outbox relay. Every variable below is the contract in
          # cmd/a2a/main.go's header comment.
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # The Agent Card must advertise a URL agent clients can dial
            # (ADR 0007): default to this release's in-cluster Service DNS.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%d/" (include "pricing.a2aFullname" .) .Release.Namespace (int .Values.a2a.service.port)) | quote }}
            # DATABASE_URL always comes from the SAME Secret as the api: the
            # agent reads the same Postgres through the same repositories.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pricing.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # A direct (non-pooled) DSN used only for the boot migrations
            # (cmd/a2a runs the same embedded, idempotent migrations as the
            # api). `optional: true` so a Secret without this key still starts
            # the pod: the binary falls back to DATABASE_URL.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pricing.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-a2a" .Values.otel.serviceName | quote }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
          # The agent writes nothing to disk and the root filesystem is
          # read-only; /tmp is a small scratch volume for the runtime.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
