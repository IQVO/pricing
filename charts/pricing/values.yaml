# Default values for pricing. One component by default: the api Deployment
# (cmd/api: REST, the outbox relay, the offer-availability consumer and the
# clock-driven policy loop in one process); the read-only A2A agent
# (cmd/a2a) is a second, optional one (a2a.enabled, default false). The chart refuses to render without the
# mandatory values below (named in the failure): database.*, kafka.brokers and
# config.offerAvailabilityConsumerGroup.

replicaCount: 1

# The image is built from this repository's Dockerfile (ENTRYPOINT ./api,
# user 1000, port 8080, root filesystem never written).
image:
  repository: warehouse/pricing
  pullPolicy: IfNotPresent
  # Empty = "v" + the chart's appVersion (the release job tags the image v<version>).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (Dockerfile USER 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Optional exposure, default off. Both route to the api Service only.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pricing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2), default off. When enabled the
# Deployment omits replicas so the HPA owns them. N>1 is safe for the outbox
# relay (row claims), the version-guarded writes (concurrent-update on
# conflict) and the consumer (stable group, inbox dedupe on the CloudEvents id
# in the same transaction); it has not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/config.go, cmd/api/main.go,
# cmd/api/policies.go). Every key maps 1:1 to one variable; nothing else is
# rendered.
config:
  httpAddr: ":8080"                    # HTTP_ADDR (its port must equal service.targetPort)
  logLevel: "info"                     # LOG_LEVEL: debug | info | warn (or warning) | error
  # PRICING_CURRENCY: the one ISO 4217 currency every price is in. Empty =
  # not rendered; the binary defaults to BRL.
  currency: ""
  # POLICY_INTERVAL: how often the clock-driven policies (sale activation /
  # expiry) run. Empty = not rendered; the binary defaults to 5s.
  policyInterval: ""
  # The offer-availability consumer always runs under a STABLE,
  # service-prefixed group id that comes from here, never from the pod name (a
  # rescheduled pod must resume from its committed offsets). REQUIRED; the
  # chart refuses an empty one and refuses *_CONSUMER_GROUP in extraEnv.
  # Suggested: pricing-offer-availability.
  offerAvailabilityConsumerGroup: ""   # OFFER_AVAILABILITY_CONSUMER_GROUP
  # OUTBOX_RELAY_INTERVAL: Go duration or plain seconds. Empty = not rendered
  # (the binary defaults to 1s).
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS: failures before the relay excludes an outbox row so a
  # poison row cannot block it; re-arm with
  # `UPDATE outbox_events SET attempts = 0 WHERE id = ...`. 0 = unlimited.
  outboxMaxAttempts: 20
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before the listener closes.
  # Empty = not rendered (the binary defaults to 5s). Whole seconds ("5s"),
  # minutes ("1m") or "0"; the chart needs the number to size the grace period.
  shutdownDrainDelay: ""

# The chart refuses to render unless database.url or database.existingSecret is
# set. DATABASE_URL always comes from a Secret (secretKeyRef), never from the
# ConfigMap.
database:
  # A DSN the chart stores in a Secret it creates. Prefer existingSecret.
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same Secret, of a DIRECT (non-pooled, session-mode) DSN used only
  # for the boot migrations (MIGRATIONS_DATABASE_URL), `optional: true` so a
  # Secret without it still starts the pod (the binary falls back to
  # DATABASE_URL). With database.url set, migrationsUrl fills it.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
  migrationsUrl: ""

# KAFKA_BROKERS (comma-separated) is MANDATORY: the outbox relay, the consumer
# and /readyz dial Kafka. Produced topic: retailnetwork.pricing.events;
# consumed: retailnetwork.offer-availability.events (dead letters on
# <topic>.dlq).
kafka:
  brokers: ""

# Fleet observability standard (ADR 0005): the pod exports traces and metrics over
# OTLP/gRPC to the Collector (Jaeger + Prometheus behind it). Export never blocks, so a
# Collector that is down costs telemetry and nothing else; otel.enabled=false renders no
# OTEL_* env. serviceName is OTEL_SERVICE_NAME. SERVICE_VERSION is the image tag
# (appVersion when empty), ENVIRONMENT is `environment`.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "pricing"

# ENVIRONMENT: deployment.environment.name on every span, metric and log line.
environment: "production"

# Extra env vars appended to the api container as a raw list. The chart refuses
# any *_MODE variable (this service has no mode: Postgres and Kafka are the only
# runtime), any variable the chart renders itself and any *_CONSUMER_GROUP (the
# group id is the config.* value).
extraEnv: []

# The Postgres dial and the migrations at boot run inside a bounded retry
# (internal/bootretry), so the startup probe allows ~60s.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's sequential graceful shutdown (cmd/api/main.go):
# SHUTDOWN_DRAIN_DELAY (5s) + HTTP drain (10s) + the consumer awaited up to 10s
# + the policy loop awaited up to 10s + the outbox relay (10s) = 45s worst
# case. The chart refuses anything that does not exceed that sum for the
# configured drain delay (a shorter period SIGKILLs the consumer, the policy
# loop or the relay mid-drain).
terminationGracePeriodSeconds: 50

nodeSelector: {}
tolerations: []
affinity: {}

# A2A (Agent2Agent) agent (cmd/a2a, ADR 0007): a READ-ONLY inbound adapter over
# the same query use cases as the REST GET routes. Skills: item_price and
# quote_status. Off by default; warehouse-infra turns it on. A separate
# Deployment + Service (<release>-a2a) in the same image (command /app/a2a). It
# needs Postgres only: it renders no Kafka, outbox or consumer variable, and
# only the api Deployment runs the outbox relay. A2A carries delegation only;
# facts between contexts still travel as CloudEvents on Kafka.
a2a:
  enabled: false
  replicaCount: 1
  # A2A_ADDR the binary listens on; keep in sync with service.targetPort.
  # (8080 is the api.)
  httpAddr: ":8093"
  # Absolute URL advertised on the Agent Card. Empty defaults to this
  # release's in-cluster Service DNS (http://<release>-a2a.<ns>.svc.cluster.local:8093/);
  # warehouse-infra can override it with the gateway path when the agent must
  # be reachable off-cluster.
  agentUrl: ""
  service:
    type: ClusterIP
    port: 8093
    targetPort: 8093
  # Gateway exposure of the A2A agent (a2a-route.yaml): host path
  # /api/a2a/<context> rewritten to / (JSON-RPC root; the well-known agent
  # card stays reachable under the same prefix). Off by default;
  # warehouse-infra turns it on with the real parentRefs and path.
  route:
    enabled: false
    path: "/api/a2a/pricing"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
